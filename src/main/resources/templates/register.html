<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout('Regisztráció - ProgTeaching', ~{::#page-content})}">
<body>

<div id="page-content" class="flex-1 flex items-center justify-center p-4 py-12">
    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md border border-gray-100">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-gray-900">Regisztráció</h2>
            <p class="text-gray-500 mt-2">Kezdd el a programozás tanulását még ma!</p>
        </div>

        <form th:action="@{/register}" method="post" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Felhasználónév</label>
                <input type="text" name="username" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">E-mail cím</label>
                <input type="email" name="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Jelszó</label>
                <input type="password" name="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg shadow-md transition mt-4">
                Fiók létrehozása
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-600">
            Már van fiókod? <a th:href="@{/login}" class="text-blue-600 font-bold hover:underline">Jelentkezz be!</a>
        </div>
    </div>
</div>

</body>
</html>
